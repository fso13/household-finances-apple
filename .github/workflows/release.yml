name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: |
          if [ -d Tests ]; then
            swift test
          fi

      - name: Package app
        env:
          APP_VERSION: ${{ github.ref_name }}
          APP_BUILD: ${{ github.run_number }}
        run: ./Scripts/package_app.sh release

      - name: Install create-dmg
        run: |
          if ! command -v create-dmg >/dev/null 2>&1; then
            brew install create-dmg
          fi

      - name: Package DMG installer
        env:
          APP_VERSION: ${{ github.ref_name }}
          APP_BUILD: ${{ github.run_number }}
          SKIP_BUILD: "1"
        run: ./Scripts/package_dmg.sh

      - name: Create release assets
        run: |
          ditto -c -k --norsrc --noextattr --keepParent \
            "dist/Финансы.app" "dist/Finances-${GITHUB_REF_NAME}.zip"
          ( cd dist && shasum -a 256 "Finances-${GITHUB_REF_NAME}.zip" "Finances-${GITHUB_REF_NAME}.dmg" > checksums.txt )
          cat "dist/checksums.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "dist/Finances-${TAG}.zip" \
            "dist/Finances-${TAG}.dmg" \
            "dist/checksums.txt" \
            --title "Финансы $TAG" \
            --generate-notes
