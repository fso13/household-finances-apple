name: Bug report
description: Что-то работает не так
title: "bug: "
labels: ["type:bug", "priority:P1"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Не прикладывайте реальные финансовые данные и полные бэкапы.
  - type: input
    id: version
    attributes:
      label: Версия приложения
      description: Видна в «Настройки» → «О приложении» или в имени релиза.
      placeholder: 1.0 (1)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Версия macOS
      placeholder: macOS 15.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть «Обязательные»
        2. Нажать «Записать оплату»
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи или скриншоты
      description: Уберите персональные данные.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Проверка
      options:
        - label: Я проверил, что issue ещё не создан
          required: true
        - label: В отчёте нет реальных финансовых данных
          required: true
